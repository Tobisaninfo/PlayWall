[package]
name = "PlayWallNativeAudioRust"
version = "0.1.0"
edition = "2024"

[dependencies]
lazy_static = "1.5.0"
jni = "0.22.0"
rodio = { version = "0.22.0", features = ["mp3"] }
symphonia = { version = "0.6.0", features = ["mp3"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

[lib]
crate-type = ["cdylib"]
