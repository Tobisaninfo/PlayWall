server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;

    location = / {
        try_files /200.html =404;
    }

    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    error_page 404 /404.html;

    location ~ ^/(_nuxt|_fonts)/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /screenshots/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location ~ ^/(favicon\.ico|favicon\.png|apple-touch-icon\.png|logo(-mark)?\.png|og-image\.png)$ {
        expires 1d;
        add_header Cache-Control "public";
    }

    location ~ ^/(robots\.txt|sitemap\.xml)$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }
}
