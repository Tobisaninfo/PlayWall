server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;

    location = / {
        try_files /200.html =404;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/index.html $uri.html =404;
        add_header Cache-Control "no-cache";
    }

    error_page 404 /404.html;

    location ~ ^/(_nuxt|_fonts)/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /screenshots/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location /downloads/ {
        proxy_pass https://maven.thecodelabs.de/artifactory/TheCodeLabs-release/de/tobias/playwall/PlayWallClient/;
        proxy_set_header Host maven.thecodelabs.de;
        proxy_set_header User-Agent "playwall-website-proxy";
        proxy_ssl_server_name on;
        proxy_read_timeout 120s;
    }

    location ~ ^/(favicon\.ico|favicon\.png|apple-touch-icon\.png|logo\.png|og-image\.png)$ {
        expires 1d;
        add_header Cache-Control "public";
    }

    location ~ ^/(robots\.txt|sitemap\.xml)$ {
        expires 1h;
        add_header Cache-Control "public";
    }
}
