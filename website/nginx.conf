# Läuft im Docker-Image hinter dem Apache-Reverse-Proxy (siehe Jenkinsfile).
# Struktur gegen einen echten `nuxt generate`-Output verifiziert, nicht nur
# angenommen: es gibt kein index.html im Root, nur 200.html/404.html als
# SPA-Fallback-Shells (strategy: "prefix" — "/" selbst ist keine echte Route).

server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;

    # "/" selbst ist keine vorgerenderte Route (strategy: "prefix") — die
    # SPA-Fallback-Shell übernimmt den Redirect auf /de oder /en im Browser.
    # Separater Block, sonst würde die generische try_files-Kette unten
    # jeden unbekannten Pfad ebenfalls auf 200.html (und Status 200) statt
    # auf einen echten 404 auflösen.
    location = / {
        try_files /200.html =404;
    }

    # Vorgerenderte Routen (/de/…, /en/…). Kein Pfad gefunden -> echter 404,
    # nicht stillschweigend die Startseite.
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    error_page 404 /404.html;

    # Gehashte Build-Assets und selbst gehostete Schriften: unbegrenzt
    # cachebar, da der Dateiname sich bei jeder Änderung ändert.
    location ~ ^/(_nuxt|_fonts)/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Screenshots kommen live aus doc/screenshots (nitro.publicAssets) und
    # sind nicht dateinamen-gehasht — moderates Caching statt "immutable",
    # damit ein geändertes Bild nicht dauerhaft hängen bleibt.
    location /screenshots/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Statische Marken-Assets (Logo, Favicons, OG-Bild): ändern sich selten,
    # aber ebenfalls nicht dateinamen-gehasht.
    location ~ ^/(favicon\.ico|favicon\.png|apple-touch-icon\.png|logo(-mark)?\.png|og-image\.png)$ {
        expires 1d;
        add_header Cache-Control "public";
    }

    # robots.txt / sitemap.xml: klein, sollen bei Änderungen zügig sichtbar
    # werden statt lange im Crawler-Cache zu hängen.
    location ~ ^/(robots\.txt|sitemap\.xml)$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    # HTML niemals cachen — sonst zeigen Browser nach einem Deploy alte
    # Seiten, die auf gelöschte _nuxt-Asset-Hashes verweisen.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }
}
