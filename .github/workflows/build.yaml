name: Maven Build (Windows, macOS & Linux, Java 25)

on:
  workflow_dispatch:  # Manuelles Triggern über GitHub UI

jobs:
  build:
    name: Build on ${{ matrix.os }} with Java ${{ matrix.java }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ windows-latest, macos-latest, ubuntu-latest, ubuntu-24.04-arm ]
        java: [25]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'

      - name: Prepare Maven settings
        shell: bash
        run: |
          mkdir -p "$HOME/.m2"
          sed -e "s|\${MAVEN_USERNAME}|${{ secrets.MAVEN_USERNAME }}|g" \
              -e "s|\${MAVEN_PASSWORD}|${{ secrets.MAVEN_PASSWORD }}|g" \
              .github/maven/settings.xml > "$HOME/.m2/settings.xml"

      - name: Show Java Version
        run: java -version

      - name: Setup Developer ID Certificate
        if: matrix.os == 'macos-latest'
        run: |
          echo "${{ secrets.DEVELOPER_ID_P12_BASE64 }}" | base64 --decode > /tmp/developer_id.p12
          echo "${{ secrets.AC_KEY }}" | base64 --decode > /tmp/ac_private_key.p8
          security create-keychain -p "" /tmp/build.keychain
          security import /tmp/developer_id.p12 -k /tmp/build.keychain -P "${{ secrets.CERT_PASSWORD }}" -T /usr/bin/codesign
          security list-keychains -s /tmp/build.keychain
          security unlock-keychain -p "" /tmp/build.keychain

      - name: Build with Maven (Mac)
        if: matrix.os == 'macos-latest'
        run: mvn -e --no-transfer-progress -P build-rust,custom-jdk,build-aot-cache,package-executables,sign-dmg,sign-rust -DskipTests deploy -Dmac.sign.identity="${MAC_SIGN_IDENTITY}" -Dmac.notary.key="${MAC_NOTARY_KEY}" -Dmac.notary.key.id="${MAC_NOTARY_KEY_ID}" -Dmac.notary.issuer="${MAC_NOTARY_ISSUER}"
        env:
          MAC_SIGN_KEYCHAIN: /tmp/build.keychain
          MAC_SIGN_IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY }}
          MAC_NOTARY_KEY: /tmp/ac_private_key.p8
          MAC_NOTARY_KEY_ID: ${{ secrets.AC_KEY_ID }}
          MAC_NOTARY_ISSUER: ${{ secrets.AC_ISSUER }}

      - name: Build with Maven (Windows)
        if: matrix.os == 'windows-latest'
        run: mvn -e --no-transfer-progress -P build-rust,custom-jdk,build-aot-cache,package-executables -DskipTests deploy

      - name: Install native build dependencies (Linux/rodio/alsa)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev

      - name: Build with Maven (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: mvn -e --no-transfer-progress -P build-rust,custom-jdk,build-aot-cache,package-executables -DskipTests deploy

      # The Linux tarballs (x86_64 and aarch64) feed the AppImage jobs below.
      - name: Collect Linux tarball for AppImage
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          mkdir -p linux-input
          cp PlayWallClient/target/installer/PlayWall-*.tar.gz linux-input/
          mvn -q -N --no-transfer-progress help:evaluate -Dexpression=project.version -DforceStdout > linux-input/version.txt
          cat linux-input/version.txt; echo
          ls -l linux-input

      - name: Upload Linux tarball
        if: startsWith(matrix.os, 'ubuntu')
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ runner.arch == 'ARM64' && 'arm64' || 'amd64' }}-tarball
          path: linux-input/
          if-no-files-found: error

  appimage:
    name: Build AppImage (${{ matrix.arch }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # appimagetool is a native binary, so each architecture is built on a matching runner
          - arch: x86_64
            os: ubuntu-latest
            tarball: linux-amd64-tarball
          - arch: aarch64
            os: ubuntu-24.04-arm
            tarball: linux-arm64-tarball

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Download Linux tarball
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.tarball }}
          path: linux-input

      - name: Build AppImage
        run: |
          mkdir -p appimage-output
          cp linux-input/version.txt appimage-output/version.txt
          packaging/appimage/build-appimage.sh \
            "$(ls linux-input/PlayWall-*.tar.gz)" \
            "appimage-output/PlayWall-${{ matrix.arch }}.AppImage" \
            "${{ matrix.arch }}"

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: appimage-${{ matrix.arch }}
          path: appimage-output/
          if-no-files-found: error

  verify-appimage:
    name: Verify AppImage (${{ matrix.name }}, ${{ matrix.arch }})
    needs: appimage
    runs-on: ${{ matrix.os }}
    # An empty container means: run directly on the runner
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Arch Linux
            family: arch
            arch: x86_64
            os: ubuntu-latest
            container: archlinux:latest
          - name: Ubuntu 24.04
            family: debian
            arch: x86_64
            os: ubuntu-24.04
            container: ''
          - name: Ubuntu 24.04
            family: debian
            arch: aarch64
            os: ubuntu-24.04-arm
            container: ''

    steps:
      # System libraries are NOT bundled in the AppImage; install what a desktop of the distribution provides.
      - name: Install host runtime libraries (Arch)
        if: matrix.family == 'arch'
        run: |
          pacman -Syu --noconfirm --needed \
            gtk3 alsa-lib pipewire-alsa freetype2 fontconfig mesa \
            libx11 libxext libxi libxrender libxtst \
            xorg-server-xvfb desktop-file-utils

      - name: Install host runtime libraries (Debian/Ubuntu)
        if: matrix.family == 'debian'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-0t64 libasound2t64 libfreetype6 libfontconfig1 libgl1 libgl1-mesa-dri \
            libx11-6 libxext6 libxi6 libxrender1 libxtst6 \
            xvfb desktop-file-utils

      - name: Download AppImage
        uses: actions/download-artifact@v8
        with:
          name: appimage-${{ matrix.arch }}
          path: appimage-output

      - name: Verify contents and library resolution
        run: |
          cd appimage-output
          chmod +x PlayWall-${{ matrix.arch }}.AppImage

          # --appimage-extract needs no FUSE (not available in containers / on CI runners).
          ./PlayWall-${{ matrix.arch }}.AppImage --appimage-extract > /dev/null
          test -x squashfs-root/AppRun
          test -x squashfs-root/usr/PlayWall/bin/PlayWall
          desktop-file-validate squashfs-root/playwall.desktop

          # Every bundled shared library must resolve against the host libraries installed above. This also catches
          # a glibc that is too old for the bundled libraries ("version `GLIBC_x' not found").
          # libjvm.so is excluded: the JDK libs reference it, but the java launcher finds it at runtime
          # via lib/server/, so a standalone ldd always reports it as missing.
          missing=0
          while IFS= read -r lib; do
            out="$(ldd "$lib" 2>&1 | grep 'not found' | grep -v 'libjvm\.so' || true)"
            if [ -n "$out" ]; then
              echo "::error::Unresolved libraries in $lib"
              echo "$out"
              missing=1
            fi
          done < <(find squashfs-root/usr/PlayWall -name '*.so*' -type f)
          exit "$missing"

      - name: Smoke test (start under Xvfb)
        # Not blocking: headless CI has no GPU or audio device, so a failure here is a hint, not proof of a broken build.
        continue-on-error: true
        run: |
          cd appimage-output
          # No FUSE available -> let the AppImage runtime extract itself.
          set +e
          APPIMAGE_EXTRACT_AND_RUN=1 timeout 30 xvfb-run -a ./PlayWall-${{ matrix.arch }}.AppImage
          code=$?
          set -e
          # 124 = still running when the timeout hit, i.e. it started and did not crash.
          if [ "$code" -ne 124 ]; then
            echo "::warning::AppImage exited early with code $code"
            exit 1
          fi

  publish-appimage:
    name: Publish AppImage (${{ matrix.arch }}) to Artifactory
    needs: verify-appimage
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [ x86_64, aarch64 ]

    steps:
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 25

      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Prepare Maven settings
        run: |
          mkdir -p "$HOME/.m2"
          sed -e "s|\${MAVEN_USERNAME}|${{ secrets.MAVEN_USERNAME }}|g" \
              -e "s|\${MAVEN_PASSWORD}|${{ secrets.MAVEN_PASSWORD }}|g" \
              .github/maven/settings.xml > "$HOME/.m2/settings.xml"

      - name: Download AppImage
        uses: actions/download-artifact@v8
        with:
          name: appimage-${{ matrix.arch }}
          path: appimage-output

      - name: Deploy to Artifactory
        run: |
          # Same coordinates and naming scheme as the other installers:
          # de.tobias.playwall:PlayWallClient:<version>:installer.<arch>.AppImage
          VERSION="$(cat appimage-output/version.txt)"

          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            REPO_ID=snapshots
            REPO_URL=https://maven.thecodelabs.de/artifactory/TheCodeLabs-snapshots/
          else
            REPO_ID=release
            REPO_URL=https://maven.thecodelabs.de/artifactory/TheCodeLabs-release/
          fi

          mvn -e --no-transfer-progress org.apache.maven.plugins:maven-deploy-plugin:3.1.4:deploy-file \
            -Dfile="appimage-output/PlayWall-${{ matrix.arch }}.AppImage" \
            -DgroupId=de.tobias.playwall \
            -DartifactId=PlayWallClient \
            -Dversion="$VERSION" \
            -Dclassifier=installer \
            -Dpackaging="${{ matrix.arch }}.AppImage" \
            -DgeneratePom=false \
            -DrepositoryId="$REPO_ID" \
            -Durl="$REPO_URL"
