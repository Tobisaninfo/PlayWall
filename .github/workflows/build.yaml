name: Maven Build (Windows, macOS & Linux, Java 25)

on:
  workflow_dispatch:  # Manuelles Triggern über GitHub UI

jobs:
  build:
    name: Build on ${{ matrix.os }} with Java ${{ matrix.java }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ windows-latest, macos-latest, ubuntu-latest, ubuntu-24.04-arm ]
        java: [25]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'

      - name: Prepare Maven settings
        shell: bash
        run: |
          mkdir -p "$HOME/.m2"
          sed -e "s|\${MAVEN_USERNAME}|${{ secrets.MAVEN_USERNAME }}|g" \
              -e "s|\${MAVEN_PASSWORD}|${{ secrets.MAVEN_PASSWORD }}|g" \
              .github/maven/settings.xml > "$HOME/.m2/settings.xml"

      - name: Show Java Version
        run: java -version

      - name: Setup Developer ID Certificate
        if: matrix.os == 'macos-latest'
        run: |
          echo "${{ secrets.DEVELOPER_ID_P12_BASE64 }}" | base64 --decode > /tmp/developer_id.p12
          echo "${{ secrets.AC_KEY }}" | base64 --decode > /tmp/ac_private_key.p8
          security create-keychain -p "" /tmp/build.keychain
          security import /tmp/developer_id.p12 -k /tmp/build.keychain -P "${{ secrets.CERT_PASSWORD }}" -T /usr/bin/codesign
          security list-keychains -s /tmp/build.keychain
          security unlock-keychain -p "" /tmp/build.keychain

      - name: Build with Maven (Mac)
        if: matrix.os == 'macos-latest'
        run: mvn -e --no-transfer-progress -P build-rust,custom-jdk,build-aot-cache,package-executables,sign-dmg,sign-rust -DskipTests deploy -Dmac.sign.identity="${MAC_SIGN_IDENTITY}" -Dmac.notary.key="${MAC_NOTARY_KEY}" -Dmac.notary.key.id="${MAC_NOTARY_KEY_ID}" -Dmac.notary.issuer="${MAC_NOTARY_ISSUER}"
        env:
          MAC_SIGN_KEYCHAIN: /tmp/build.keychain
          MAC_SIGN_IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY }}
          MAC_NOTARY_KEY: /tmp/ac_private_key.p8
          MAC_NOTARY_KEY_ID: ${{ secrets.AC_KEY_ID }}
          MAC_NOTARY_ISSUER: ${{ secrets.AC_ISSUER }}

      - name: Build with Maven (Windows)
        if: matrix.os == 'windows-latest'
        run: mvn -e --no-transfer-progress -P build-rust,custom-jdk,build-aot-cache,package-executables -DskipTests deploy

      - name: Install native build dependencies (Linux/rodio/alsa)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev

      - name: Build with Maven (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: mvn -e --no-transfer-progress -P build-rust,custom-jdk,build-aot-cache,package-executables -DskipTests deploy
